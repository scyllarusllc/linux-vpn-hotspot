<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux VPN Hotspot · log</title>
<link rel="stylesheet" href="/fa/css/all.min.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ec; --dim: #8b93a3; --accent: #6ea8fe;
    /* Status palette (reserved for state): always shown with a word, never color alone. */
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  a { color: var(--accent); text-decoration: none; }
  h1 i, h2 i, button i, .sub a i { margin-right: 6px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 i { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 24px 0 8px; }
  .sub { color: var(--dim); margin: 0; }
  .mono { font-family: ui-monospace, monospace; font-size: 12.5px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--dim); font-size: 12px; }
  .tile .v { font-weight: 600; font-size: 18px; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; }
  .bar button, .bar select, .bar input { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 11px; font: inherit; }
  .bar button { cursor: pointer; color: var(--dim); }
  .bar button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  .bar input { flex: 1; min-width: 160px; }
  .bar .sp { flex: 1; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.time { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
  td.kind { white-space: nowrap; width: 1%; }
  td.kind i { width: 18px; text-align: center; margin-right: 6px; }
  td.dev { white-space: nowrap; }
  td.detail { color: var(--dim); word-break: break-word; }
  .k-connect i { color: var(--good); }
  .k-disconnect i { color: var(--dim); }
  .k-rejected i { color: var(--critical); }
  .k-pause i { color: var(--warning); }
  .k-hotspot i, .k-firewall i, .k-swap i, .k-proxy i, .k-server i, .k-label i { color: var(--accent); }
  tr.day td { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
              padding-top: 18px; border-bottom-color: var(--line); }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .more { color: var(--dim); font-size: 12px; margin-top: 8px; }
</style>
<link rel="stylesheet" href="/assets/layout.css">
</head>
<body>
<!--#header-->
<main>
  <h1><i class="fa-solid fa-list-ul" aria-hidden="true"></i>Log</h1>
  <p class="sub">Devices joining and leaving the hotspot, hotspot and proxy changes, and connections the proxy rejected.
    Refreshes every 5 seconds.</p>

  <div class="tiles" id="tiles"></div>

  <div class="bar" id="kinds" role="group" aria-label="Show"></div>
  <div class="bar">
    <select id="device" aria-label="Device"><option value="">All devices</option></select>
    <select id="range" aria-label="Time range">
      <option value="60">Last hour</option>
      <option value="1440" selected>Last 24 hours</option>
      <option value="10080">Last 7 days</option>
      <option value="43200">Last 30 days</option>
    </select>
    <input id="q" type="search" placeholder="Filter text (name, IP, site…)" aria-label="Filter text">
  </div>

  <table><tbody id="rows"></tbody></table>
  <p class="more" id="more"></p>
</main>
<!--#footer-->

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Each event kind: label and icon. Filters group kinds so the bar stays short.
const kinds = {
  connect: { label: 'Connected', icon: 'right-to-bracket' },
  disconnect: { label: 'Disconnected', icon: 'right-from-bracket' },
  rejected: { label: 'Rejected', icon: 'ban' },
  pause: { label: 'Pause', icon: 'circle-pause' },
  label: { label: 'Renamed', icon: 'tag' },
  hotspot: { label: 'Hotspot', icon: 'tower-broadcast' },
  firewall: { label: 'Firewall', icon: 'shield-halved' },
  swap: { label: 'Swap', icon: 'right-left' },
  proxy: { label: 'Proxy', icon: 'shield-halved' },
  server: { label: 'Server', icon: 'server' },
};
const filters = [
  { id: 'all', label: 'All', icon: 'list-ul', kinds: [] },
  { id: 'conn', label: 'Connections', icon: 'plug', kinds: ['connect', 'disconnect'] },
  { id: 'devices', label: 'Device actions', icon: 'mobile-screen', kinds: ['pause', 'label'] },
  { id: 'system', label: 'System', icon: 'gear', kinds: ['hotspot', 'swap', 'proxy', 'firewall', 'server'] },
  { id: 'rejected', label: 'Rejected', icon: 'ban', kinds: ['rejected'] },
];

const params = new URLSearchParams(location.search);
let filter = filters.find((f) => f.id === params.get('show')) ?? filters[0];
if (params.get('mac')) $('device').innerHTML += `<option value="${esc(params.get('mac'))}" selected>${esc(params.get('mac'))}</option>`;
if (params.get('range')) $('range').value = params.get('range');
let data = { events: [], counts: {} };

$('kinds').innerHTML = filters.map((f) =>
  `<button type="button" data-f="${f.id}" aria-pressed="${f === filter}"><i class="fa-solid fa-${f.icon}" aria-hidden="true"></i>${f.label}</button>`).join('');
$('kinds').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  filter = filters.find((f) => f.id === b.dataset.f);
  for (const x of $('kinds').querySelectorAll('button')) x.setAttribute('aria-pressed', x === b);
  syncUrl();
  load();
});
$('device').addEventListener('change', () => { syncUrl(); load(); });
$('range').addEventListener('change', () => { syncUrl(); load(); });
$('q').addEventListener('input', render);

// Keep the filters in the address bar so a view can be bookmarked or shared.
function syncUrl() {
  const p = new URLSearchParams();
  if (filter.id !== 'all') p.set('show', filter.id);
  if ($('device').value) p.set('mac', $('device').value);
  if ($('range').value !== '1440') p.set('range', $('range').value);
  history.replaceState(null, '', p.size ? `?${p}` : location.pathname);
}

const dayOf = (t) => new Date(t).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const timeOf = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const nameOf = (e) => e.alias ?? e.hostname ?? e.mac;

// "online 3725s" from the server reads better as "online 1 h 2 min".
const dur = (s) => (s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min`
  : `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`);
const prettyDetail = (d) => String(d ?? '').replace(/online (\d+)s/, (_, s) => `online ${dur(Number(s))}`);

async function loadDevices() {
  const { devices } = await fetch('/api/devices?range=43200').then((r) => r.json());
  const cur = $('device').value;
  $('device').innerHTML = '<option value="">All devices</option>' + devices.map((d) =>
    `<option value="${esc(d.mac)}" ${d.mac === cur ? 'selected' : ''}>${esc(d.alias ?? d.hostname ?? d.mac)}${d.online ? ' · online' : ''}</option>`).join('');
}

async function load() {
  const p = new URLSearchParams({ range: $('range').value });
  if (filter.kinds.length) p.set('kinds', filter.kinds.join(','));
  if ($('device').value) p.set('mac', $('device').value);
  try {
    data = await fetch(`/api/log?${p}`).then((r) => r.json());
  } catch {
    return;
  }
  render();
}

function render() {
  const c = data.counts ?? {};
  const range = $('range').selectedOptions[0].textContent.toLowerCase();
  $('tiles').innerHTML = [
    ['Connects', c.connect ?? 0], ['Disconnects', c.disconnect ?? 0],
    ['Rejected', c.rejected ?? 0], ['Admin actions', ['pause', 'label', 'hotspot', 'swap', 'proxy', 'firewall'].reduce((s, k) => s + (c[k] ?? 0), 0)],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k} · ${esc(range)}</div><div class="v">${v.toLocaleString()}</div></div>`).join('');

  const q = $('q').value.trim().toLowerCase();
  const events = q
    ? data.events.filter((e) => [nameOf(e), e.mac, e.ip, e.detail, kinds[e.kind]?.label].some((v) => String(v ?? '').toLowerCase().includes(q)))
    : data.events;

  let day = null;
  $('rows').innerHTML = events.map((e) => {
    const k = kinds[e.kind] ?? { label: e.kind, icon: 'circle' };
    const d = dayOf(e.t);
    const head = d !== day ? `<tr class="day"><td colspan="4">${esc(d)}</td></tr>` : '';
    day = d;
    const dev = e.mac
      ? `<a href="/device?mac=${encodeURIComponent(e.mac)}">${e.icon ? `<i class="fa-solid fa-${esc(e.icon)}" aria-hidden="true"></i> ` : ''}${esc(nameOf(e))}</a>
         ${e.ip ? `<span class="mono" style="color:var(--dim)">${esc(e.ip)}</span>` : ''}`
      : e.ip ? `<span class="mono">${esc(e.ip)}</span>` : '';
    return `${head}<tr>
      <td class="time">${timeOf(e.t)}</td>
      <td class="kind k-${esc(e.kind)}"><i class="fa-solid fa-${k.icon}" aria-hidden="true"></i>${esc(k.label)}</td>
      <td class="dev">${dev}</td>
      <td class="detail">${esc(prettyDetail(e.detail))}</td>
    </tr>`;
  }).join('') || '<tr><td class="empty" colspan="4">Nothing logged in this range.</td></tr>';
  $('more').textContent = data.events.length >= 1000 ? 'Showing the newest 1,000 entries; narrow the range or filter to see older ones.' : '';
}

await Promise.all([loadDevices(), load()]);
setInterval(load, 5000);
setInterval(loadDevices, 60_000);
</script>
</body>
</html>
